format_version = 5
id = "tobal2.unlock"
version = "0.1.0"
name = "Tobal 2 - Characters"
author = "Tobal2Recomp"
description = "Character select: original roster or every fighter unlocked."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLPM-86033"
disc_sha256 = "04e79535b4616963e045957b4f9b87126753e94b01d35d32c60214df04bf5a5a"

# Configuração, não mod: escondido da página Mods (game.toml
# [runtime] hide_hidden_mod_features) e sempre ligado. O launcher mostra o
# grupo "Characters" como cartão na tela inicial (patch do recomp-ui), e no
# Windows o menu da barra de título da janela do jogo troca a opção na hora.
[[feature]]
id = "all_characters"
name = "Characters"
description = "Which fighters the character select screen offers."
group = "Characters"
hidden = true
default_enabled = true

[[option]]
feature = "all_characters"
id = "unlock"
label = "Characters"
description = "All unlocked: every fighter, secret ones and the 184 Quest monsters included, from the start. Your save is not changed."
group = "Characters"
type = "choice"
default = "off"

[[option.choice]]
value = "off"
label = "Original"

[[option.choice]]
value = "on"
label = "All unlocked"

# O plugin (src/mods/unlock_characters.c) troca 11 instruções da tela de
# seleção (lista de personagens e de monstros do Quest) conforme a opção,
# também com o jogo rodando.
[[plugin]]
feature = "all_characters"
id = "tobal2.unlock-characters"

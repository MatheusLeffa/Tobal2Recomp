# --- extras de 'en' (en.toml) ---
# Ajustes extras do idioma inglês (anexados ao manifest por tools/make_lang_mod.py).
#
# Menu de título (func_80053298): as letras latinas são desenhadas com a mesma
# largura dos caracteres japoneses, e "TOURNAMENT" (10 letras) passava do
# quadro feito para "トーナメント" (6). O quadro escuro cresce 16 px de cada
# lado (152..360 -> 136..376, continua centrado em 256) e o texto, a sombra, a
# seta e a barra de seleção andam 16 px para a esquerda, mantendo os mesmos
# espaçamentos do original. Cada troca confere a instrução original
# (ori reg, $zero, imediato) antes de aplicar.

[[patch]]
feature = "language"
target = "main_exe"
address = 0x800532A8
expected = "c8 00 13 34"   # ori $s3, $zero, 200  (x do texto, 1ª passada)
replace  = "b8 00 13 34"   # 184
when = { lang = "en" }

